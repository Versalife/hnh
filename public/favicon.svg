<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#111827"/>
  <!-- Sparkline: the shape of inquiry — tentative start, dip, decisive climb -->
  <polyline
    points="4,23 9,18 15,21 21,11 27,8"
    stroke="#f0ebe0"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Red endpoint: the moment of insight -->
  <circle cx="27" cy="8" r="2.5" fill="#dc2626"/>
</svg>
